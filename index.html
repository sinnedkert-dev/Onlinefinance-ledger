<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stonino Online Ledger</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
<div id="loginScreen" class="min-h-screen flex flex-col items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-sm text-center">
    <div class="text-4xl mb-3">📒</div>
    <h1 class="text-2xl font-bold">Stonino Ledger</h1>
    <p class="text-slate-500 text-sm mb-6">Admin Login Only • Email & Password</p>
    <input id="email" type="email" placeholder="Email" class="w-full border rounded-lg p-3 mb-2">
    <input id="password" type="password" placeholder="Password" class="w-full border rounded-lg p-3 mb-3">
    <button id="loginBtn" class="w-full bg-black text-white py-3 rounded-xl font-bold">Login</button>
    <p id="loginError" class="text-red-500 text-sm mt-4 hidden"></p>
    <p class="text-xs text-slate-400 mt-4">Only admin can access. Others will be denied.</p>
    <div class="flex justify-center gap-3 mt-4 text-xs">
      <button onclick="openPolicy('privacy')" class="text-blue-600 underline">Privacy Policy</button>
      <button onclick="openPolicy('terms')" class="text-blue-600 underline">Terms</button>
      <button onclick="openPolicy('content')" class="text-blue-600 underline">Content Policy</button>
    </div>
  </div>
  <p class="text-[11px] text-slate-400 text-center mt-4 max-w-sm">By signing in, you agree to our Content Policy, Privacy Policy and Terms of Service.</p>
</div>
<div id="appScreen" class="hidden max-w-3xl mx-auto p-4">
  <div class="flex justify-between items-center mb-4"><div><h1 class="text-2xl font-bold">Stonino Ledger</h1><p id="userEmail" class="text-sm text-slate-500"></p></div><button id="logoutBtn" class="bg-red-500 text-white px-4 py-2 rounded-lg text-sm font-bold">Logout</button></div>
  <div class="grid grid-cols-3 gap-3 mb-4">
    <div class="bg-white rounded-xl p-4 text-center"><p class="text-xs text-slate-400">INCOME</p><p id="totalIn" class="font-bold text-green-600 text-lg">₱0</p></div>
    <div class="bg-white rounded-xl p-4 text-center"><p class="text-xs text-slate-400">EXPENSE</p><p id="totalOut" class="font-bold text-red-600 text-lg">₱0</p></div>
    <div class="bg-black rounded-xl p-4 text-center"><p class="text-xs text-slate-300">BALANCE</p><p id="balance" class="font-bold text-white text-lg">₱0</p></div>
  </div>
  <div class="bg-white rounded-xl p-4 mb-4">
    <div class="grid grid-cols-2 gap-2 mb-2"><select id="type" class="border rounded-lg p-3"><option value="income">Income +</option><option value="expense">Expense -</option></select><input id="amount" type="number" placeholder="Amount ₱" class="border rounded-lg p-3"></div>
    <input id="desc" placeholder="Description - hal. Offering, Kuryente" class="w-full border rounded-lg p-3 mb-2">
    <input id="date" type="date" class="w-full border rounded-lg p-3 mb-3">
    <button id="addBtn" class="w-full bg-black text-white py-3 rounded-xl font-bold">+ Add Record</button>
  </div>
  <div id="list" class="space-y-2"></div>
  <div class="text-center mt-8 pb-6"><p class="text-xs text-slate-400">© 2026 Stonino Online Ledger</p><div class="flex justify-center gap-3 mt-2 text-xs"><button onclick="openPolicy('privacy')" class="text-blue-600 underline">Privacy Policy</button><button onclick="openPolicy('terms')" class="text-blue-600 underline">Terms</button><button onclick="openPolicy('content')" class="text-blue-600 underline">Content Policy</button></div></div>
</div>
<div id="policyModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50"><div class="bg-white rounded-2xl max-w-lg w-full max-h-[85vh] overflow-y-auto p-6"><div class="flex justify-between"><h2 id="policyTitle" class="text-xl font-bold mb-3"></h2><button onclick="closePolicy()" class="text-2xl">×</button></div><div id="policyBody" class="text-sm text-slate-600 space-y-3"></div><button onclick="closePolicy()" class="w-full bg-black text-white py-3 rounded-xl font-bold mt-5">Close</button></div></div>
<script>
const policies = {
  privacy: { title: "Privacy Policy", body: `<p><b>Last updated: Nov 20, 2026</b></p><p>Private admin-only finance tool. We collect only email, UID, and finance records you enter. We do NOT sell or share data. Stored securely in Firebase Firestore.</p>` },
  terms: { title: "Terms of Service", body: `<p><b>Last updated: Nov 20, 2026</b></p><p>For authorized admin only. You are responsible for records you enter. Do not attempt to bypass login. Service provided as-is via Firebase Hosting.</p>` },
  content: { title: "Content Policy & Acceptable Use", body: `<p><b>Last updated: Nov 20, 2026</b></p><p>Finance descriptions only - e.g. Offering, Kuryente, Rent.</p><p><b>Bawal:</b> Hate speech, harassment, violent/sexual content, illegal activity, fraud, sensitive personal data (bank account, password, ID), spam, malware links.</p><p><b>Report:</b> Contact admin. Review within 48h. Violation = remove + warning, repeated = permanent ban.</p>` }
};
function openPolicy(k){ const p=policies[k]; document.getElementById('policyTitle').textContent=p.title; document.getElementById('policyBody').innerHTML=p.body; document.getElementById('policyModal').classList.remove('hidden'); }
function closePolicy(){ document.getElementById('policyModal').classList.add('hidden'); }
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyCGRNaxVtedlBmf3UgHfIl06LDwXQdXxpg",
  authDomain: "stoninofinance-platform.firebaseapp.com",
  projectId: "stoninofinance-platform",
  storageBucket: "stoninofinance-platform.firebasestorage.app",
  messagingSenderId: "302507626314",
  appId: "1:302507626314:web:28749f1ef7035b38ea3bb3",
  measurementId: "G-R8KXLLBDL7"
};
const ADMIN_UID = "4rBLfsIDFEOJHIGvPvcU8y6Kite2";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const loginScreen = document.getElementById('loginScreen');
const appScreen = document.getElementById('appScreen');
const loginError = document.getElementById('loginError');
document.getElementById('loginBtn').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  try { await signInWithEmailAndPassword(auth, email, password); }
  catch(e){ loginError.textContent = "Mali email/password: " + e.message; loginError.classList.remove('hidden'); }
};
document.getElementById('logoutBtn').onclick = () => signOut(auth);
onAuthStateChanged(auth, (user) => {
  if (!user) { loginScreen.classList.remove('hidden'); appScreen.classList.add('hidden'); return; }
  if (user.uid !== ADMIN_UID) { loginError.textContent = "Access denied. Admin only."; loginError.classList.remove('hidden'); signOut(auth); alert("Hindi ka admin."); return; }
  document.getElementById('userEmail').textContent = user.email + " • Admin";
  loginScreen.classList.add('hidden'); appScreen.classList.remove('hidden'); loadData();
});
document.getElementById('date').valueAsDate = new Date();
document.getElementById('addBtn').onclick = async () => {
  const type = document.getElementById('type').value;
  const amount = parseFloat(document.getElementById('amount').value);
  const desc = document.getElementById('desc').value.trim();
  const date = document.getElementById('date').value;
  if (!amount || !desc) return alert("Lagyan mo amount at description");
  await addDoc(collection(db, "finance_records"), { type, amount, desc, date, createdAt: serverTimestamp(), uid: auth.currentUser.uid });
  document.getElementById('amount').value = ""; document.getElementById('desc').value = "";
};
function loadData(){
  const q = query(collection(db, "finance_records"), orderBy("createdAt", "desc"));
  onSnapshot(q, (snap) => {
    let inc=0, out=0; let html="";
    snap.forEach(d => { const r = d.data(); if(r.type==="income") inc+=r.amount; else out+=r.amount;
      html += `<div class="bg-white rounded-xl p-3 flex justify-between items-center"><div><p class="font-bold">${r.desc}</p><p class="text-xs text-slate-400">${r.date || ""} • ${r.type}</p></div><div class="flex items-center gap-3"><b class="${r.type==="income"?"text-green-600":"text-red-600"}">${r.type==="income"?"+":"-"}₱${r.amount.toLocaleString()}</b><button onclick="window.delRec('${d.id}')" class="text-red-500 text-xs">Delete</button></div></div>`; });
    document.getElementById('list').innerHTML = html || "<p class='text-center text-slate-400'>Walang record pa.</p>";
    document.getElementById('totalIn').textContent = "₱"+inc.toLocaleString();
    document.getElementById('totalOut').textContent = "₱"+out.toLocaleString();
    document.getElementById('balance').textContent = "₱"+(inc-out).toLocaleString();
  });
}
window.delRec = async (id) => { if(confirm("Delete?")) await deleteDoc(doc(db,"finance_records",id)); };
</script>
</body>
</html>
